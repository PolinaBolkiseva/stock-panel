<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель управления остатками товаров</title>
  </head>
  <body class="page">
    <main class="panel">
      <h1 class="panel__title">Остатки товаров</h1>

      <!-- Статичная разметка: контейнер для списка карточек -->
      <section class="catalog">
        <ul class="catalog__list"></ul>
      </section>
    </main>

    <!-- Статичная разметка: модальное окно, универсальный контейнер для любого содержимого -->
    <div class="modal" id="modal-container">
      <div class="modal__container">
        <button class="modal__close" type="button" aria-label="закрыть">
          ×
        </button>
        <div class="modal__content"></div>
      </div>
    </div>

    <!-- Динамическая разметка: шаблон карточки, клонируется на каждый товар -->
    <template id="product-card">
      <li class="card">
        <h2 class="card__title"></h2>
        <p class="card__stock"></p>
        <span class="card__price"></span>
      </li>
    </template>

    <!-- Шаблон формы документа поступления. Показывается в модалке. -->
    <template id="receipt">
      <form class="form receipt" name="receipt">
        <h2 class="receipt__title"></h2>
        <p class="receipt__stock"></p>

        <div class="receipt__reasons">
          <button type="button" class="button button_alt" name="supplier">От поставщика</button>
          <button type="button" class="button button_alt" name="customer-return">
            Возврат от покупателя
          </button>
        </div>

        <label class="receipt__field">
          <span>Количество</span>
          <input
            class="receipt__input"
            name="quantity"
            type="number"
            min="1"
            step="1"
            placeholder="Сколько поступило"
          />
        </label>

        <button type="submit" class="button receipt__submit" disabled>Провести</button>
        <span class="receipt__errors"></span>
      </form>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
